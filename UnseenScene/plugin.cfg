[plugin]

name="UnseenScene"
description="Adds Unseen Scene tab to the main menus, an accessible 2D scene editor replacement.
Works by having a virtual cursor start on 0X0, and reports everything in it's \"region\" which is a square that has its top left corner on the cursor. "
author="Ericbomb"
version="1.0"
script="unseen_scene_plugin.gd"
